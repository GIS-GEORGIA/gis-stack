[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gisstack-installer"
version = "0.1.2"
description = "One-click GIS server stack: PostGIS, GeoServer, Tomcat, MapProxy, QGIS Server, Caddy, web & mobile maps"
requires-python = ">=3.9"
dependencies = ["Flask>=3.0", "Jinja2>=3.1", "PyYAML>=6.0"]
license = { text = "MIT" }
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/GIS-GEORGIA/gis-stack"
Issues = "https://github.com/GIS-GEORGIA/gis-stack/issues"

[project.scripts]
gisstack = "gisstack.cli:main"

[tool.setuptools.packages.find]
include = ["gisstack*"]

[tool.setuptools.package-data]
gisstack = ["templates/**/*", "vendor/**/*", "webgui/templates/*"]

[project.optional-dependencies]
prod = ["waitress>=3.0"]
dev = ["ruff", "mypy", "coverage", "bandit", "pip-audit", "types-PyYAML", "build"]

[tool.ruff]
target-version = "py39"
line-length = 140
extend-exclude = ["build", "dist", "gisstack/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "C4", "SIM", "UP"]
ignore = [
    "E501",    # long lines: templates and Georgian text
    "E741",    # `l` for log lines / listeners is idiomatic in the parsers
    "C408",    # dict(key=value) is used for readable palettes
    "S101",    # assert is used for invariants the type checker cannot see
    "S105", "S106",   # empty-string "password" defaults are not credentials
    "S404", "S603", "S607",   # subprocess is the point of this tool; arguments are lists, never shell strings
    "UP006", "UP007", "UP035", "UP045",   # keep typing spelling stable while Python 3.9 is supported
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011", "B017", "SIM117"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
files = ["gisstack"]
warn_unused_ignores = true

[tool.coverage.run]
source = ["gisstack"]
# the Tk desktop GUI needs a display; it is exercised by hand and in the VM checks, not in the CI coverage figure
omit = ["gisstack/desktop.py"]
branch = false

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
