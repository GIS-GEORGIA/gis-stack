name: release

# Publish a GitHub Release (what `gisstack update` and the GUI's "განახლების შემოწმება" look at)
# whenever a version tag such as v0.1.3 is pushed.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag must match the package version
        run: |
          V="${GITHUB_REF_NAME#v}"
          P="$(python3 -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"", open("gisstack/__init__.py").read()).group(1))')"
          T="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$V  gisstack/__init__.py=$P  pyproject.toml=$T"
          [ "$V" = "$P" ] && [ "$V" = "$T" ] || { echo "::error::version mismatch - bump gisstack/__init__.py and pyproject.toml to $V"; exit 1; }

      - run: pip install flask jinja2 pyyaml mapproxy build
      - run: python3 -m unittest discover -s tests

      - name: Build archive and packages
        run: |
          python3 -m build --sdist --outdir dist
          packaging/build.sh deb
          sudo apt-get install -y rpm >/dev/null && packaging/build.sh rpm || echo "rpm skipped"
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $V" > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "GIS Stack Installer $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
