# Integration and end-to-end tests (roadmap Phase 11b).  They install real software inside throw-away containers, so they run nightly, on demand,
# and on pull requests that carry the label `integration` - never on every push.  Nothing here touches production infrastructure.
name: integration

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ contains(github.event.pull_request.labels.*.name, 'integration') }}" = "true" ]; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi

  installer:
    name: installer (${{ matrix.distro }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, ubuntu-24.04, debian-12, rocky-9, alma-9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask jinja2 pyyaml
      - name: Native installer in a systemd container (PostGIS, status, manager, idempotence, uninstall/purge)
        env:
          GISSTACK_TEST_INSTALLER: "1"
          GISSTACK_TEST_DISTROS: ${{ matrix.distro }}
        run: python -m unittest discover -s tests -p 'test_installer.py' -v
      - name: deb / rpm packages installed with apt / dnf
        env:
          GISSTACK_TEST_INSTALLER: "1"
          GISSTACK_TEST_DISTROS: ${{ matrix.distro }}
        run: |
          sudo apt-get install -y rpm
          python -m unittest discover -s tests -p 'test_packages.py' -v

  compose:
    name: compose (real Docker)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask jinja2 pyyaml
      - env:
          GISSTACK_TEST_DOCKER: "1"
        run: |
          python -m unittest discover -s tests -p 'test_compose.py' -v
          python -m unittest discover -s tests -p 'test_deploy_rollback.py' -v
          GISSTACK_TEST_INTEGRATION=1 python -m unittest discover -s tests -p 'test_compose_managers.py' -v

  browser:
    name: browser end-to-end (Playwright)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install flask jinja2 pyyaml playwright
          playwright install --with-deps chromium
      - env:
          GISSTACK_TEST_E2E: "1"
        run: python -m unittest discover -s tests -p 'test_browser.py' -v

  kubernetes:
    name: kubernetes (kind)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask jinja2 pyyaml
      - uses: helm/kind-action@v1
      - name: PostGIS, GeoServer and MapProxy managers against the kind cluster (real kubectl exec)
        env:
          GISSTACK_TEST_K8S: "1"
        run: python -m unittest discover -s tests -p 'test_k8s_managers.py' -v
      - name: Deploy, failed upgrade and rollback against the kind cluster
        env:
          GISSTACK_TEST_K8S: "1"
        run: python -m unittest discover -s tests -p 'test_deploy_rollback_k8s.py' -v
