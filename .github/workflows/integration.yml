# Integration and end-to-end tests (roadmap Phase 11b).  They install real software inside throw-away containers, so they run nightly, on demand,
# and on pull requests that carry the label `integration` - never on every push.  Nothing here touches production infrastructure.
name: integration

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

env:
  # an image that cannot be obtained FAILS the tests that need it (named as such), it never silently skips them
  GISSTACK_REQUIRE_IMAGES: "1"

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ contains(github.event.pull_request.labels.*.name, 'integration') }}" = "true" ]; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi

  installer:
    name: installer (${{ matrix.distro }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu-22.04, ubuntu-24.04, debian-12, rocky-9, alma-9]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the upgrade test builds the previous release from its tag
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask jinja2 pyyaml
      - name: Native installer in a systemd container (PostGIS, status, manager, idempotence, uninstall/purge)
        env:
          GISSTACK_TEST_INSTALLER: "1"
          GISSTACK_TEST_DISTROS: ${{ matrix.distro }}
        run: python -m unittest discover -s tests -p 'test_installer.py' -v
      - name: deb / rpm packages installed with apt / dnf
        env:
          GISSTACK_TEST_INSTALLER: "1"
          GISSTACK_TEST_DISTROS: ${{ matrix.distro }}
        run: |
          sudo apt-get install -y rpm
          python -m unittest discover -s tests -p 'test_packages.py' -v
      - name: Packaged-service upgrade from the previous release (deb) and a real disk-capacity alert
        if: matrix.distro == 'ubuntu-24.04'
        env:
          GISSTACK_TEST_INSTALLER: "1"
        run: |
          python -m unittest discover -s tests -p 'test_package_upgrade.py' -v
          python -m unittest discover -s tests -p 'test_monitoring_disk.py' -v

  compose:
    name: compose (real Docker)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask jinja2 pyyaml
      - name: GeoServer image (bounded pull; exit 10 = REGISTRY UNAVAILABLE, 11 = pull failed, 12 = digest mismatch - never a test failure)
        env:
          GISSTACK_IMAGE_PULL_BACKOFF: "20"
        run: python -m tests.integration.images "$(python -c 'from tests.integration import images; print(images.geoserver_image())')"
      - env:
          GISSTACK_TEST_DOCKER: "1"
        run: |
          python -m unittest discover -s tests -p 'test_compose.py' -v
          python -m unittest discover -s tests -p 'test_deploy_rollback.py' -v
          GISSTACK_TEST_INTEGRATION=1 python -m unittest discover -s tests -p 'test_compose_managers.py' -v
          GISSTACK_TEST_INTEGRATION=1 python -m unittest discover -s tests -p 'test_stack_backup_compose.py' -v
          GISSTACK_TEST_INTEGRATION=1 python -m unittest discover -s tests -p 'test_stack_backup_gis.py' -v
          GISSTACK_TEST_INTEGRATION=1 python -m unittest discover -s tests -p 'test_caddy_acme.py' -v
          GISSTACK_TEST_INTEGRATION=1 python -m unittest discover -s tests -p 'test_stack_backup_ssh.py' -v
          GISSTACK_TEST_INTEGRATION=1 python -m unittest discover -s tests -p 'test_compose_exposure.py' -v
          GISSTACK_TEST_INTEGRATION=1 python -m unittest discover -s tests -p 'test_hardening.py' -v
          GISSTACK_TEST_INTEGRATION=1 python -m unittest discover -s tests -p 'test_web_behind_proxy.py' -v
          GISSTACK_TEST_INTEGRATION=1 python -m unittest discover -s tests -p 'test_tomcat_manager_block.py' -v
          GISSTACK_TEST_INTEGRATION=1 python -m unittest discover -s tests -p 'test_custom_ports.py' -v
          GISSTACK_TEST_INTEGRATION=1 python -m unittest discover -s tests -p 'test_pg_ready.py' -v

  browser:
    name: browser end-to-end (Playwright)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install flask jinja2 pyyaml playwright waitress
          playwright install --with-deps chromium
      - env:
          GISSTACK_TEST_E2E: "1"
        run: |
          python -m unittest discover -s tests -p 'test_browser.py' -v
          python -m unittest discover -s tests -p 'test_browser_backup.py' -v
          python -m unittest discover -s tests -p 'test_browser_csp.py' -v

  kubernetes:
    name: kubernetes (kind)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask jinja2 pyyaml
      - id: gsimg
        run: echo "image=$(python -c 'from tests.integration import images; print(images.geoserver_image())')" >> "$GITHUB_OUTPUT"
      - name: Cached copy of the GeoServer image (survives a registry outage; bump the -v1 suffix to refresh it)
        uses: actions/cache@v4
        with:
          path: /tmp/geoserver-image.tar
          key: geoserver-image-${{ steps.gsimg.outputs.image }}-v1
      - uses: helm/kind-action@v1
      - name: Make the GeoServer image available (exit 10 = REGISTRY UNAVAILABLE, 11 = pull failed, 12 = digest mismatch - reported here, not as a test failure)
        env:
          GISSTACK_IMAGE_PULL_BACKOFF: "20"
          IMG: ${{ steps.gsimg.outputs.image }}
        run: |
          if [ -f /tmp/geoserver-image.tar ]; then docker load -i /tmp/geoserver-image.tar; fi
          python -m tests.integration.images "$IMG"
          docker image inspect --format 'GeoServer image: {{.Id}} {{.RepoDigests}}' "$IMG"
          [ -f /tmp/geoserver-image.tar ] || docker save -o /tmp/geoserver-image.tar "$IMG"
          # preload into kind so the pods do not depend on the registry; if that fails the pods pull it themselves (and the diagnostics below say why)
          docker save --platform linux/amd64 "$IMG" | docker exec -i chart-testing-control-plane ctr --namespace=k8s.io images import --snapshotter=overlayfs - \
            || echo "::warning::could not preload the image into kind; the pods will pull it themselves"
      - name: PostGIS, GeoServer and MapProxy managers against the kind cluster (real kubectl exec)
        env:
          GISSTACK_TEST_K8S: "1"
        run: python -m unittest discover -s tests -p 'test_k8s_managers.py' -v
      - name: Deploy, failed upgrade and rollback against the kind cluster
        env:
          GISSTACK_TEST_K8S: "1"
        run: python -m unittest discover -s tests -p 'test_deploy_rollback_k8s.py' -v
      - name: Backup, restore, failure and recovery against the kind cluster
        env:
          GISSTACK_TEST_K8S: "1"
        run: python -m unittest discover -s tests -p 'test_stack_backup_k8s.py' -v
      - name: "clean without --purge keeps the namespace, the volume and the data (real kind cluster)"
        env:
          GISSTACK_TEST_K8S: "1"
        run: python -m unittest discover -s tests -p 'test_k8s_clean_keeps_data.py' -v
      - name: Diagnostics (pod status, events, describe, logs) - kept for every failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          kubectl describe pods -A | grep -B2 -A25 -E "^Events:" | tail -150 || true
          kubectl get pods -A --no-headers -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name | grep -vE '^(kube-system|local-path-storage)' | while read ns pod; do echo "== $ns/$pod"; kubectl -n "$ns" logs "$pod" --all-containers --tail=40 2>&1 | head -60; done || true

  kubernetes-gis:
    name: kubernetes-gis (kind)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask jinja2 pyyaml
      - uses: helm/kind-action@v1
      - name: Caddy, MapProxy, QGIS backup/restore and PostgreSQL/backup monitoring against the kind cluster
        env:
          GISSTACK_TEST_K8S: "1"
        run: python -m unittest discover -s tests -p 'test_stack_backup_k8s_gis.py' -v
