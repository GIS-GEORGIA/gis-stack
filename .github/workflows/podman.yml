name: podman

# Real Podman: deploy a stack through gis-stack with runtime=podman, then run the backup / restore cases (same cases as Docker Compose and Kubernetes).
# Manual or weekly - it pulls the PostGIS and GeoServer images.  Two jobs: rootful (system Podman, as root) and rootless (the runner user).
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  rootful:
    name: podman (rootful)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask jinja2 pyyaml podman-compose
      - name: Podman version and info
        run: |
          podman --version
          sudo podman info --format '{{.Host.Security.Rootless}} {{.Store.GraphDriverName}} {{.Host.CgroupManager}}'
          podman-compose --version
      - name: Backup / restore cases on Podman (as root)
        env:
          GISSTACK_TEST_PODMAN: "1"
        run: sudo -E env "PATH=$PATH" python -W error::ResourceWarning -m unittest discover -s tests -p 'test_stack_backup_podman.py' -v
      - name: Reliability on Podman (rollback, monitoring, provider diagnostic) (as root)
        env:
          GISSTACK_TEST_PODMAN: "1"
          PODMAN_COMPOSE_PROVIDER: podman-compose
        run: sudo -E env "PATH=$PATH" python -W error::ResourceWarning -m unittest discover -s tests -p 'test_podman_reliability.py' -v

  rootless:
    name: podman (rootless)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flask jinja2 pyyaml podman-compose
      - name: User session for rootless Podman healthchecks (systemd --user)
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          sleep 3
      - name: Podman version and info
        run: |
          podman --version
          podman info --format '{{.Host.Security.Rootless}} {{.Store.GraphDriverName}} {{.Host.CgroupManager}}'
      - name: Backup / restore cases on Podman (rootless)
        env:
          GISSTACK_TEST_PODMAN: "1"
          # The runner has the Docker Compose plugin, which `podman compose` prefers over podman-compose. That provider talks to the Podman API socket,
          # which a rootless session does not run ("Cannot connect to the Docker daemon at unix:///run/user/1001/podman/podman.sock"). Pin the
          # provider we install (this is the combination verified on Ubuntu 24.04 + Podman 4.9.3 + podman-compose 1.6.0).
          PODMAN_COMPOSE_PROVIDER: podman-compose
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_stack_backup_podman.py' -v
      - name: Reliability on Podman, rootless (rollback, monitoring; the provider diagnostic runs because the runner has the Docker Compose plugin and no Podman socket)
        env:
          GISSTACK_TEST_PODMAN: "1"
          PODMAN_COMPOSE_PROVIDER: podman-compose
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_podman_reliability.py' -v
