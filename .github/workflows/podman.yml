name: podman

# Real Podman: deploy a stack through gis-stack with runtime=podman, then run the backup / restore cases (same cases as Docker Compose and Kubernetes).
# Manual or weekly - it pulls the PostGIS and GeoServer images.  Two jobs: rootful (system Podman, as root) and rootless (the runner user).
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

env:
  # an image that cannot be obtained FAILS the tests that need it (named as such), it never silently skips them
  GISSTACK_REQUIRE_IMAGES: "1"

jobs:
  rootful:
    name: podman (rootful)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install flask jinja2 pyyaml podman-compose
      - name: Podman version and info
        run: |
          podman --version
          sudo podman info --format '{{.Host.Security.Rootless}} {{.Store.GraphDriverName}} {{.Host.CgroupManager}}'
          podman-compose --version
      - name: GeoServer image (bounded pull; exit 10 = REGISTRY UNAVAILABLE, 11 = pull failed - never a test failure) (as root)
        env:
          GISSTACK_IMAGE_PULL_BACKOFF: "20"
        run: sudo -E env "PATH=$PATH" python -m tests.integration.images --engine podman "$(python -c 'from tests.integration import images; print(images.geoserver_image())')"
      - name: "Hardening bisect, as root (diagnostic only - which restriction stops PostGIS here?)"
        continue-on-error: true
        run: |
          sudo podman pull -q docker.io/postgis/postgis:17-3.5 >/dev/null
          sudo sh -c 'echo "kernel: $(uname -r)  apparmor: $(cat /sys/module/apparmor/parameters/enabled 2>/dev/null)  selinux: $(cat /sys/fs/selinux/enforce 2>/dev/null)"; aa-status 2>/dev/null | head -3 || true'
          CAPS="--cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETGID --cap-add SETUID"
          NNP="--security-opt no-new-privileges"
          try() {
            name="$1"; shift
            sudo podman rm -f gsbis >/dev/null 2>&1
            sudo podman run -d --name gsbis -e POSTGRES_PASSWORD=x "$@" docker.io/postgis/postgis:17-3.5 >/dev/null 2>&1 || { echo "$name: could not start"; return; }
            ok=no; for i in $(seq 1 25); do sleep 2; sudo podman exec gsbis pg_isready -h 127.0.0.1 >/dev/null 2>&1 && { ok=yes; break; }; done
            echo "== $name: pg_ready=$ok"; [ "$ok" = yes ] || { sudo podman top gsbis user pid args 2>&1 | head -4; sudo podman logs --tail 5 gsbis 2>&1 | head -8; }
          }
          try baseline
          try "no-new-privileges only" $NNP
          try "caps only (drop ALL + 5 adds)" $CAPS
          try "no-new-privileges + caps (what gis-stack generates)" $NNP $CAPS
          try "caps + SETPCAP" $CAPS --cap-add SETPCAP
          try "nnp + caps + apparmor=unconfined" $NNP $CAPS --security-opt apparmor=unconfined
          try "nnp + caps + seccomp=unconfined" $NNP $CAPS --security-opt seccomp=unconfined
          sudo podman rm -f gsbis >/dev/null 2>&1 || true
      - name: Backup / restore cases on Podman (as root)
        env:
          GISSTACK_TEST_PODMAN: "1"
        run: sudo -E env "PATH=$PATH" python -W error::ResourceWarning -m unittest discover -s tests -p 'test_stack_backup_podman.py' -v
      - name: Reliability on Podman (rollback, monitoring, provider diagnostic) (as root)
        env:
          GISSTACK_TEST_PODMAN: "1"
          PODMAN_COMPOSE_PROVIDER: podman-compose
        run: sudo -E env "PATH=$PATH" python -W error::ResourceWarning -m unittest discover -s tests -p 'test_podman_reliability.py' -v

  rootless:
    name: podman (rootless)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install flask jinja2 pyyaml podman-compose
      - name: User session for rootless Podman healthchecks (systemd --user)
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          sleep 3
      - name: Podman version and info
        run: |
          podman --version
          podman info --format '{{.Host.Security.Rootless}} {{.Store.GraphDriverName}} {{.Host.CgroupManager}}'
      - name: GeoServer image (bounded pull; exit 10 = REGISTRY UNAVAILABLE, 11 = pull failed - never a test failure) (rootless)
        env:
          GISSTACK_IMAGE_PULL_BACKOFF: "20"
        run: python -m tests.integration.images --engine podman "$(python -c 'from tests.integration import images; print(images.geoserver_image())')"
      - name: Backup / restore cases on Podman (rootless)
        env:
          GISSTACK_TEST_PODMAN: "1"
          # The runner has the Docker Compose plugin, which `podman compose` prefers over podman-compose. That provider talks to the Podman API socket,
          # which a rootless session does not run ("Cannot connect to the Docker daemon at unix:///run/user/1001/podman/podman.sock"). Pin the
          # provider we install (this is the combination verified on Ubuntu 24.04 + Podman 4.9.3 + podman-compose 1.6.0).
          PODMAN_COMPOSE_PROVIDER: podman-compose
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_stack_backup_podman.py' -v
      - name: Reliability on Podman, rootless (rollback, monitoring; the provider diagnostic runs because the runner has the Docker Compose plugin and no Podman socket)
        env:
          GISSTACK_TEST_PODMAN: "1"
          PODMAN_COMPOSE_PROVIDER: podman-compose
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_podman_reliability.py' -v
