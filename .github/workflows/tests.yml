name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff mypy types-PyYAML flask jinja2 pyyaml
      - run: ruff check .
      - run: mypy

  shell-yaml:
    name: shell, YAML, Compose and Kubernetes validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install flask jinja2 pyyaml yamllint
      - name: Render a bundle for every target (all components on)
        run: |
          cat > /tmp/all.json <<'JSON'
          {"targets": ["native", "compose", "k8s"], "components": {"geoserver": true, "tomcat": true, "qgis_server": true, "mapproxy": true, "caddy": true, "webmap": true}}
          JSON
          python3 -m gisstack generate -c /tmp/all.json -o /tmp/bundle
      - name: shellcheck (repository scripts and rendered scripts)
        run: |
          shellcheck --version
          shellcheck -S warning install.sh packaging/*.sh
          shellcheck -S warning /tmp/bundle/native/install.sh /tmp/bundle/native/uninstall.sh /tmp/bundle/compose/up.sh /tmp/bundle/k8s/apply.sh
      - name: yamllint (workflows and rendered manifests)
        run: |
          printf 'extends: relaxed\nrules:\n  line-length: disable\n  truthy: disable\n' > /tmp/yamllint.yml
          yamllint -c /tmp/yamllint.yml .github /tmp/bundle/k8s /tmp/bundle/compose/docker-compose.yml
      - name: docker compose config
        run: docker compose -f /tmp/bundle/compose/docker-compose.yml --env-file /tmp/bundle/compose/.env config -q
      - name: kubeconform (rendered Kubernetes manifests)
        run: |
          docker run --rm -v /tmp/bundle/k8s:/k8s:ro ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas \
            /k8s/namespace.yaml /k8s/secret.yaml /k8s/postgis.yaml /k8s/geoserver.yaml /k8s/mapproxy.yaml /k8s/caddy.yaml /k8s/tomcat.yaml /k8s/qgis.yaml

  test:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies (MapProxy 7 needs Python 3.10+; its test is skipped on 3.9)
        run: |
          pip install flask jinja2 pyyaml "coverage[toml]"
          if python -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)'; then pip install mapproxy; fi
      - name: Run the test suite with coverage
        run: |
          coverage run -m unittest discover -s tests
          coverage report
      - name: Coverage floor (a ratchet - raise the number when coverage improves)
        if: matrix.python == '3.12'
        run: coverage report --fail-under=70

  security:
    name: dependency and code security checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit
      - name: Known vulnerabilities in the declared dependencies
        run: |
          printf 'Flask>=3.0\nJinja2>=3.1\nPyYAML>=6.0\n' > /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt
      - name: Bandit (medium and high severity)
        run: bandit -r gisstack -ll

  build:
    name: build sdist, wheel, deb and rpm and install them
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: sdist and wheel
        run: |
          python -m build
          twine check dist/*
      - name: Install the wheel into a clean virtualenv and use it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/gisstack --version
          /tmp/venv/bin/gisstack generate -o /tmp/from-wheel
          test -f /tmp/from-wheel/native/install.sh
      - name: deb package, installed with apt
        run: |
          packaging/build.sh deb
          sudo apt-get install -y ./dist/gisstack-installer_*_all.deb
          PATH=/usr/bin:/bin gisstack --version      # the system python3 with the distro's jinja2, not setup-python's
      - name: rpm package
        run: |
          sudo apt-get install -y rpm
          packaging/build.sh rpm
          rpm -qpl dist/*.rpm | head -5
